<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneLearn · 洛克文学习</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <!-- 顶部 -->
    <header class="masthead">
      <div class="brand">
        <span class="brand-rune" aria-hidden="true">R</span>
        <div class="brand-text">
          <h1 class="brand-title" id="brand-title" title="点击切换字形">RuneLearn</h1>
          <p class="brand-sub">洛克文 · 识记与转换</p>
        </div>
      </div>

      <!-- 两大板块切换 -->
      <nav class="main-tabs" role="tablist">
        <button class="tab active" data-main="convert" role="tab" aria-selected="true">洛克文转换</button>
        <button class="tab" data-main="recognize" role="tab" aria-selected="false">洛克文识记</button>
      </nav>
    </header>

    <main class="content">

      <!-- ============ 板块一：洛克文转换 ============ -->
      <section class="panel active" id="panel-convert" data-main="convert">
        <div class="card">
          <h2 class="panel-title">洛克文转换</h2>
          <p class="panel-desc">输入文本，实时以洛克文字型显示，可自定义样式并导出透明 PNG。</p>

          <div class="convert-input-row">
            <textarea id="convert-input" class="text-input convert-textarea" placeholder="输入文字" rows="2"
                      spellcheck="false"></textarea>
            <button id="convert-clear" class="btn ghost" type="button">清空</button>
          </div>

          <div class="convert-stage">
            <div class="stage-canvas" id="convert-stage" aria-live="polite">
              <span class="stage-placeholder">输入文字后此处显示</span>
            </div>
          </div>

          <div class="convert-controls">
            <label class="field">
              <span>字形颜色</span>
              <input type="color" id="convert-color" value="#2f3a4d">
            </label>
            <label class="field">
              <span>描边颜色</span>
              <input type="color" id="convert-stroke-color" value="#7d6b3a">
            </label>
            <label class="field">
              <span>描边粗细</span>
              <input type="range" id="convert-stroke" min="0" max="12" value="0" step="0.5">
            </label>
            <label class="field">
              <span>字号大小</span>
              <input type="range" id="convert-size" min="24" max="120" value="64" step="2">
            </label>
            <div class="field">
              <span>字形</span>
              <div class="script-toggle" id="convert-script">
                <button type="button" class="script-btn" data-script="normal">正常</button>
                <button type="button" class="script-btn active" data-script="rune">洛克文</button>
              </div>
            </div>
            <button id="convert-export" class="btn primary" type="button">导出透明 PNG</button>
          </div>
          <p class="hint" id="convert-hint"></p>
        </div>
      </section>

      <!-- ============ 板块二：洛克文识记 ============ -->
      <section class="panel" id="panel-recognize" data-main="recognize">

        <!-- 子板块切换 -->
        <nav class="sub-tabs" role="tablist">
          <button class="sub-tab active" data-sub="letter" role="tab" aria-selected="true">认字母</button>
          <button class="sub-tab" data-sub="word" role="tab" aria-selected="false">认单词</button>
        </nav>

        <!-- 2.1 认字母 -->
        <div class="subpanel active" id="sub-letter" data-sub="letter">
          <div class="card">
            <h2 class="panel-title">认字母</h2>
            <p class="panel-desc">看洛克文字形，写出对应的英文字母，不区分大小写。</p>

            <div class="quiz-col">
              <div class="quiz-play">
                <div class="quiz-stage">
                  <span class="quiz-glyph" id="letter-glyph">?</span>
                </div>
                <button class="btn ghost" id="letter-next" type="button">换一个</button>
              </div>

              <div class="quiz-answer">
                <input type="text" id="letter-input" class="text-input letter-input" placeholder="输入字母，回车或点确定" maxlength="1"
                       autocomplete="off" spellcheck="false">
                <button class="btn primary" id="letter-submit" type="button">确定</button>
              </div>

              <div class="verdict" id="letter-verdict"></div>
            </div>

            <div class="history-wrap">
              <div class="history-head">
                <h3>历史记录</h3>
                <button class="btn ghost small" id="letter-history-clear" type="button">清空</button>
              </div>
              <div class="history-table" id="letter-history"></div>
            </div>
          </div>
        </div>

        <!-- 2.2 认单词 -->
        <div class="subpanel" id="sub-word" data-sub="word">
          <div class="card">
            <h2 class="panel-title">认单词</h2>
            <p class="panel-desc">看洛克文字形，拼出对应的英文单词。</p>

            <div class="difficulty-bar">
              <span class="difficulty-label">难度</span>
              <div class="difficulty-tabs" id="difficulty-tabs">
                <button class="difficulty active" data-diff="easy">简单</button>
                <button class="difficulty" data-diff="med">中等</button>
                <button class="difficulty" data-diff="hard">困难</button>
                <!-- 专家在困难连续答对5次后解锁 -->
                <button class="difficulty locked hidden" data-diff="expert" disabled title="困难难度连续答对5次后解锁">专家</button>
              </div>
              <span class="detail" id="word-streak-hint"></span>
            </div>

            <div class="quiz-col">
              <div class="quiz-play">
                <div class="quiz-stage">
                  <span class="quiz-glyph word-glyph" id="word-glyph"></span>
                </div>
                <div class="quiz-meta" id="word-meta"></div>
                <button class="btn ghost" id="word-next" type="button">换一个</button>
              </div>

              <div class="quiz-answer">
                <input type="text" id="word-input" class="text-input" placeholder="输入单词，回车或点确定"
                       autocomplete="off" spellcheck="false">
                <button class="btn primary" id="word-submit" type="button">确定</button>
              </div>

              <div class="verdict" id="word-verdict"></div>
            </div>

            <div class="history-wrap">
              <div class="history-head">
                <h3>历史记录</h3>
                <button class="btn ghost small" id="word-history-clear" type="button">清空</button>
              </div>
              <div class="history-table" id="word-history"></div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>卡洛西亚的凌晨四点 Co-created with Deepseek V4 Flash</p>
    </footer>
  </div>

  <script src="js/wordbank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
